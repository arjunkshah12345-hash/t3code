    (function () {
      const tl = gsap.timeline({ paused: true });
      // Open: the tab blurs in already sharp-edged, the time a beat later.

      tl.fromTo("#tab-text", { x: -118 }, { x: -118, duration: 0.01 }, 0);

      // Knock knock KNOCK: each knock jolts the strip.
      const knock = (t, i, big) => tl.fromTo("#tab-strip", { x: big ? 16 : (i % 2 ? 9 : -9) }, { x: 0, duration: 0.24, ease: "elastic.out(1.1, 0.4)" }, t);

      [2.998, 3.266, 3.534].forEach((t, i) => knock(t, i, i === 2));
      // First thread waits: the title makes room and the count arrives.
      tl.to("#tab-text", { x: 0, duration: 0.45, ease: "expo.out" }, 1.927);
      tl.fromTo("#tab-count", { opacity: 0, scale: 1.5, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 1.947);

      // The line, word by word from blur, no travel.
      ["#tab-w1", "#tab-w2", "#tab-w3", "#tab-w4", "#tab-w5", "#tab-w6"].forEach((id, i) => {
        tl.fromTo(id, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, 3.95 + i * 0.08);

      tl.to("#tab-line", { opacity: 0, filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, 5.55);

      tl.to("#tab-cam", { filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 6.05);

      window.__timelines["tab"] = tl;
