<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/dm-sans-latin.woff2") format("woff2"); font-weight: 100 1000; font-style: normal; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 100 800; font-style: normal; }
      :root {
        --ground: #07060d;
        --ink: #f6ecdc;
        --ink-muted: rgba(246, 236, 220, 0.64);
        --ink-dim: rgba(246, 236, 220, 0.4);
        --accent: #eba854;
        --gold: #ffd08a;
        --surface: #1b1512;
        --surface-2: #241c17;
        --line: rgba(246, 236, 220, 0.12);
        --done: #6ee7b7;
        --pending: #fcd34d;
        --bad: #f87171;
        --font-display: "DM Sans", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); color: var(--ink); }
      #root > [data-composition-id] { position: absolute; inset: 0; }
      #world { z-index: 1; }
      #tab { z-index: 2; }
      #jump { z-index: 3; }
      #report { z-index: 4; }
      #quiet { z-index: 5; }
      #end { z-index: 6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="36" data-width="1920" data-height="1080">
