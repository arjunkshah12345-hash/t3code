  <script>
    (function () {
      // Stars from a fixed hash, so every frame is identical on every render.
      const stars = document.querySelector("#world-stars");
      for (let i = 0; i < 70; i++) {
        const h = (n) => { const x = Math.sin(i * 127.1 + n * 311.7) * 43758.5453; return x - Math.floor(x); };
        const s = document.createElement("i");
        s.style.left = (h(1) * 1920).toFixed(1) + "px";
        s.style.top = (h(2) * 700).toFixed(1) + "px";
        s.style.opacity = (0.25 + h(3) * 0.75).toFixed(2);
        const r = 1.5 + h(4) * 2.5; s.style.width = s.style.height = r.toFixed(1) + "px";
        stars.appendChild(s);
      }

      const tl = gsap.timeline({ paused: true });
      const times = [0, 2.4, 8.0, 9.0, 10.0, 11.0, 11.9, 18.62, 22.0, 25.0, 28.3];
      times.forEach((t, i) => {
        tl.set("#world-t" + i, { opacity: 1 }, t);
        if (i < times.length - 1) tl.set("#world-t" + i, { opacity: 0 }, times[i + 1]);
      });
      // The clock jumps during the stall: each jump lands with a small drop.
      [8.0, 9.0, 10.0, 11.0, 11.9].forEach((t) => {
        tl.fromTo("#world-clock", { y: -10 }, { y: 0, duration: 0.35, ease: "power3.out" }, t);
      });

      // The knocks jolt the whole night.
      [12.9, 13.35, 13.8].forEach((t, i) => {
        tl.fromTo(["#world-town", "#world-stars"], { x: i % 2 ? 14 : -14 }, { x: 0, duration: 0.3, ease: "elastic.out(1.2, 0.35)" }, t);
      });

      // The clock steps aside for the knocks and the title, then returns.
      tl.to("#world-clock", { opacity: 0, scale: 0.96, duration: 0.25, ease: "power2.in" }, 12.55);
      tl.to("#world-clock", { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 17.2);

      // Night to dawn across the film.
      tl.fromTo("#world-dawn", { opacity: 0 }, { opacity: 1, duration: 15, ease: "sine.inOut" }, 14.2);
      tl.fromTo("#world-stars", { opacity: 0.85 }, { opacity: 0, duration: 10, ease: "sine.in" }, 15);
      tl.fromTo("#world-glow", { opacity: 0, y: 160 }, { opacity: 1, y: 0, duration: 14, ease: "sine.out" }, 16);
      tl.fromTo("#world-town-front", { attr: { fill: "#07050a" } }, { attr: { fill: "#2a1410" }, duration: 13, ease: "sine.inOut" }, 15);
      tl.fromTo("#world-town-back", { attr: { fill: "#120c14" } }, { attr: { fill: "#6a3527" }, duration: 13, ease: "sine.inOut" }, 15);
      tl.fromTo("#world-windows", { opacity: 1 }, { opacity: 0.15, duration: 6, ease: "sine.in" }, 22);

      // Clock: big in the night, tucked away for the proof, centred for the claim.
      tl.fromTo("#world-clock", { opacity: 0.0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#world-clock-meta", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.3);
      tl.to("#world-clock-meta", { opacity: 0, duration: 0.3 }, 6.6);
      tl.to("#world-clock", { x: 0, y: -122, scale: 0.21, duration: 0.7, ease: "power3.inOut" }, 18.95);
      tl.to("#world-clock", { x: 690, y: 0, scale: 0.42, duration: 0.8, ease: "power3.inOut" }, 28.2);
      tl.to("#world-clock", { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, 31.1);

      window.__timelines["world"] = tl;
    })();
