<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/dm-sans-latin.woff2") format("woff2"); font-weight: 100 1000; font-style: normal; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 100 800; font-style: normal; }
      :root {
        --ground: #07060d;
        --ink: #f6ecdc;
        --ink-muted: rgba(246, 236, 220, 0.62);
        --accent: #eba854;
        --font-display: "DM Sans", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
        --working: rgba(125, 211, 252, 0.8);
        --pending: rgba(252, 211, 77, 0.9);
        --completed: rgba(110, 231, 183, 0.9);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); color: var(--ink); }
      #root > [data-composition-id] { position: absolute; inset: 0; }
      #world { z-index: 1; }
      #app { z-index: 2; }
      #proof { z-index: 3; }
      #knock { z-index: 4; }
      #end { z-index: 5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="37" data-width="1920" data-height="1080">
      <div id="world" data-composition-id="world" data-composition-src="compositions/world.html" data-start="0" data-duration="37" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="app" data-composition-id="app" data-composition-src="compositions/app.html" data-start="0" data-duration="19.8" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="knock" data-composition-id="knock" data-composition-src="compositions/knock.html" data-start="12.4" data-duration="5.2" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html" data-start="19.3" data-duration="9.3" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="28.2" data-duration="8.8" data-track-index="5" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <audio id="bgm-night" class="clip" src="assets/bgm/night.mp3" data-start="0" data-duration="12.9" data-track-index="10" data-volume="0.9" data-fade-in="0.6" data-fade-out="2.2"></audio>
      <audio id="bgm-dawn" class="clip" src="assets/bgm/dawn.mp3" data-start="14.3" data-duration="22.7" data-track-index="11" data-volume="0.42" data-fade-in="0.5" data-fade-out="2.4"></audio>

      <audio id="sfx-knock-1" class="clip" src="assets/sfx/notification-input.mp3" data-start="12.9" data-duration="0.7" data-track-index="12" data-volume="1.6"></audio>
      <audio id="sfx-knock-2" class="clip" src="assets/sfx/notification-input.mp3" data-start="13.35" data-duration="0.7" data-track-index="13" data-volume="1.6"></audio>
      <audio id="sfx-knock-3" class="clip" src="assets/sfx/notification-input.mp3" data-start="13.8" data-duration="0.7" data-track-index="14" data-volume="1.9"></audio>

      <audio id="sfx-pending" class="clip" src="assets/sfx/snap-shot-click.mp3" data-start="4.6" data-duration="0.22" data-track-index="15" data-volume="0.35"></audio>
      <audio id="sfx-approve" class="clip" src="assets/sfx/snap-shot-click.mp3" data-start="18.62" data-duration="0.22" data-track-index="15" data-volume="0.9"></audio>
      <audio id="sfx-whoosh-proof" class="clip" src="assets/sfx/snap-shot-whoosh.mp3" data-start="19.2" data-duration="0.57" data-track-index="16" data-volume="0.55"></audio>
      <audio id="sfx-commit" class="clip" src="assets/sfx/snap-shot-click.mp3" data-start="25.82" data-duration="0.22" data-track-index="17" data-volume="0.8"></audio>
      <audio id="sfx-pr" class="clip" src="assets/sfx/snap-shot-click.mp3" data-start="26.92" data-duration="0.22" data-track-index="17" data-volume="0.8"></audio>
      <audio id="sfx-done" class="clip" src="assets/sfx/notification-completion.mp3" data-start="27.5" data-duration="0.6" data-track-index="18" data-volume="0.8"></audio>
      <audio id="sfx-whoosh-end" class="clip" src="assets/sfx/snap-shot-whoosh.mp3" data-start="28.05" data-duration="0.57" data-track-index="16" data-volume="0.45"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
