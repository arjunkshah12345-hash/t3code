name: Sahur website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/sahur-website.yml"

permissions:
  contents: read

concurrency:
  group: sahur-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"
      - name: Install pnpm
        run: npm install --global pnpm@12.14.0
      - name: Install website dependencies
        run: pnpm --filter @t3tools/marketing... install --frozen-lockfile --ignore-scripts
      - name: Build village website
        run: pnpm --filter @t3tools/marketing build
        env:
          PAGES_SITE_URL: https://${{ github.repository_owner }}.github.io
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/marketing/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy village website
        id: deployment
        uses: actions/deploy-pages@v4
